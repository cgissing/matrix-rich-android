name: Android

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build native UI web runtime APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;21.3.6528147"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local Element Web runtime
        run: bash tools/rich-client/prepare-element-web-runtime.sh

      - name: Run rich-client unit tests
        run: ./gradlew --no-daemon :rich-client:testDebugUnitTest --stacktrace

      - name: Build rich-client debug APK
        run: ./gradlew --no-daemon :rich-client:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: matrix-rich-native-ui-web-runtime-debug-apk
          path: rich-client/build/outputs/apk/debug/*.apk
